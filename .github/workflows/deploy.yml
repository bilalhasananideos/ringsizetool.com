# Push to main -> the site updates. Nothing is deployed by hand.
#
# The important step here is `npm run verify`, not the deploy. This site's only
# claim is that its numbers are computed from the published standards rather
# than copied, and 187 assertions are what hold that up. They run BEFORE the
# build, so a broken conversion cannot reach the live site: the job fails and
# the previous deployment stays up.
#
# The Pages project is Direct Upload (`wrangler pages deploy`), not a
# Git-connected project. That is deliberate - a Git-connected project cannot be
# converted from Direct Upload, so switching would mean a new project, a new
# pages.dev subdomain, and re-attaching the custom domain. This keeps both.

name: Deploy

on:
  push:
    branches: [main]
  # Pull requests get the same gate, but never deploy.
  pull_request:
    branches: [main]
  # Lets you re-run a deploy from the Actions tab without an empty commit.
  workflow_dispatch:

concurrency:
  # A newer push makes an in-flight deploy pointless. Cancel it rather than
  # racing two uploads into the same project.
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # v4 targeted Node 20, which GitHub deprecated: every run was being
      # force-migrated to Node 24 with a warning annotation. Bumped 7 Sep 2026.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # `npm ci` respects the lockfile exactly. `npm install` would be free to
      # resolve a different tree than the one tested locally.
      - run: npm ci

      - name: Verify the size data
        run: npm run verify

      # `astro build` does NOT type-check: esbuild strips the types in the tool's
      # <script> without looking at them, so a real error compiles and ships.
      # Installed 6 Sep 2026 after 71 minutes of a backgrounded `astro check`
      # turned out to be a dependency prompt waiting for a keypress. It found two
      # genuine errors on its first clean run.
      # Remove this step and the `check` script together if it is ever dropped.
      - name: Type-check the components and pages
        run: npm run check

      - run: npm run build

      # Astro deletes the newline between text and a following {expression} or
      # inline tag, so "set Scale to" + newline + "<strong>100%</strong>" ships as
      # "to100%". It is invisible in the source and in the diff, and the build
      # passes either way - which is exactly why it needs a gate rather than a
      # habit. It had shipped on five pages (19 occurrences) before 31 Aug 2026.
      - name: Sweep for eaten newlines in the rendered prose
        run: npm run sweep

      # A page that ships with `noindex` when the site is meant to be live -
      # or without it while the site is meant to be private - is the one SEO
      # mistake here that is expensive to undo. Fail loudly either way.
      #
      # 404.html and 500.html are ALWAYS noindexed and never follow the flag: an
      # error page in the index is a bad result for a real query. They are
      # excluded from the live-site count and checked separately below.
      #
      # ⚠️ That exclusion is why this step reads the way it does. The original
      # version asked for zero noindexed pages once NOINDEX_SITE was false, and
      # its false-branch had never executed - the flag was true from the day the
      # gate was written until 1 Sep 2026. The two error pages would have failed
      # the deploy on the launch commit itself. A gate whose other half has never
      # run is not a gate yet.
      - name: Check the noindex flag matches config
        run: |
          EXPECTED=$(grep -oE 'NOINDEX_SITE = (true|false)' src/config.ts | awk '{print $3}')
          ALWAYS='dist/404.html dist/500.html'
          NOINDEXED=$(grep -l 'name="robots" content="noindex' dist/*.html || true)
          TOTAL=$(ls dist/*.html | wc -l | tr -d ' ')
          FOUND=$(echo "$NOINDEXED" | grep -c . || true)
          # The same count with the two error pages taken out.
          FOUND_REAL=$(echo "$NOINDEXED" \
            | grep -v -e '^$' -e '^dist/404\.html$' -e '^dist/500\.html$' \
            | grep -c . || true)
          echo "NOINDEX_SITE=$EXPECTED - $FOUND of $TOTAL pages carry noindex ($FOUND_REAL of them are not error pages)"

          # Error pages must be noindexed no matter what the flag says.
          for p in $ALWAYS; do
            if ! grep -q 'name="robots" content="noindex' "$p"; then
              echo "::error::$p must always carry noindex, flag or not"; exit 1
            fi
          done

          if [ "$EXPECTED" = "true" ] && [ "$FOUND" != "$TOTAL" ]; then
            echo "::error::NOINDEX_SITE is true but only $FOUND of $TOTAL pages are noindexed"; exit 1
          fi
          if [ "$EXPECTED" = "false" ] && [ "$FOUND_REAL" != "0" ]; then
            echo "::error::NOINDEX_SITE is false but $FOUND_REAL non-error pages still carry noindex"; exit 1
          fi

      - name: Deploy to Cloudflare Pages
        # Pushes to main only. A PR gets the checks above and stops there.
        if: github.event_name != 'pull_request'
        # v4's only breaking change is that it defaults to Wrangler v4
        # instead of v3 — which is what this project already runs locally
        # (4.112.0), so CI and the owner's machine now agree rather than
        # differing by a major. Checked in the release notes, not assumed.
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=ringsizetool --branch=main
